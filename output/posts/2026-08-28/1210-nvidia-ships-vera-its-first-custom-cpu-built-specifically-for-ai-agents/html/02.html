<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<style>

    @page {
      size: 1080px 1350px;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1350px;
      background: #F4EFE4;
    }

    body {
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: #111311;
      overflow: hidden;
    }

    :root {
      --gb-cream: #F4EFE4;
      --gb-forest: #12352B;
      --gb-ink: #111311;
      --gb-gold: #B99A5B;
      --background: #F4EFE4;
      --foreground: #111311;
      --accent-primary: #12352B;
      --accent-secondary: #6B7D75;
      --muted: #59645F;
      --signal: #C46B4D;
      --surface: #E8E2D8;
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 78px 78px 70px;
      background: var(--background);
      color: var(--foreground);
      overflow: hidden;
    }

    .slide.dark {
      background: #111311;
      color: #F4EFE4;
    }

    .slide.cream {
      background: #F4EFE4;
      color: #111311;
    }

    .top-meta {
      position: absolute;
      left: 78px;
      right: 78px;
      top: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: .82;
    }

    .page-no {
      font-family: "SFMono-Regular", Consolas, monospace;
      letter-spacing: 1px;
    }

    .rule {
      width: 84px;
      height: 5px;
      background: var(--accent-primary);
      margin-bottom: 28px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 14px;
      border: 1.5px solid var(--accent-primary);
      color: var(--accent-primary);
      font-size: 19px;
      font-weight: 850;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    .dark .kicker {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
    }

    .headline {
      margin: 0;
      max-width: 920px;
      font-size: 78px;
      line-height: .94;
      letter-spacing: -3.8px;
      font-weight: 900;
    }

    .headline.small {
      font-size: 62px;
      letter-spacing: -2.5px;
    }

    .headline.huge {
      font-size: 126px;
      line-height: .82;
      letter-spacing: -7px;
    }

    .body {
      margin-top: 30px;
      max-width: 810px;
      font-size: 32px;
      line-height: 1.18;
      font-weight: 520;
    }

    .body strong {
      font-weight: 900;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .footer {
      position: absolute;
      left: 78px;
      right: 78px;
      bottom: 52px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
    }

    .source {
      max-width: 680px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 16px;
      line-height: 1.25;
      opacity: .72;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .brand {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 2.2px;
      text-transform: uppercase;
    }

    .accent-word {
      color: var(--accent-primary);
    }

    .signal {
      color: var(--signal);
    }

    .number-wrap {
      margin-top: 58px;
    }

    .number {
      font-family: Inter, Arial, sans-serif;
      font-size: 245px;
      line-height: .72;
      letter-spacing: -14px;
      font-weight: 950;
      color: var(--accent-primary);
    }

    .number-label {
      margin-top: 40px;
      max-width: 790px;
      font-size: 37px;
      line-height: 1.03;
      font-weight: 820;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 54px;
    }

    .stat {
      padding: 32px;
      min-height: 235px;
      background: var(--surface);
      border-top: 5px solid var(--accent-primary);
    }

    .stat .value {
      font-size: 78px;
      line-height: .85;
      font-weight: 950;
      letter-spacing: -4px;
    }

    .stat .label {
      margin-top: 22px;
      font-size: 24px;
      line-height: 1.05;
      font-weight: 750;
    }

    .evidence-frame {
      position: absolute;
      left: 78px;
      right: 78px;
      top: 315px;
      bottom: 145px;
      background: #ddd;
      overflow: hidden;
      border: 1px solid var(--accent-primary);
    }

    .evidence-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .evidence-tag {
      position: absolute;
      top: 285px;
      left: 98px;
      padding: 9px 13px;
      background: var(--accent-primary);
      color: var(--background);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .quote {
      margin-top: 60px;
      max-width: 850px;
      padding-left: 32px;
      border-left: 7px solid var(--accent-primary);
      font-size: 52px;
      line-height: 1.02;
      font-weight: 850;
      letter-spacing: -2px;
    }

    .diagram {
      margin-top: 62px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .node {
      flex: 1;
      min-height: 150px;
      padding: 28px;
      background: var(--surface);
      border: 1.5px solid var(--accent-primary);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .node .label {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 17px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: .75;
    }

    .node .value {
      margin-top: 13px;
      font-size: 31px;
      line-height: 1;
      font-weight: 900;
    }

    .arrow {
      font-size: 52px;
      font-weight: 900;
      color: var(--accent-primary);
    }

    .timeline {
      margin-top: 58px;
      position: relative;
      padding-left: 38px;
      border-left: 5px solid var(--accent-primary);
    }

    .timeline-item {
      margin-bottom: 38px;
      position: relative;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -52px;
      top: 4px;
      width: 20px;
      height: 20px;
      background: var(--background);
      border: 5px solid var(--accent-primary);
    }

    .timeline-date {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-primary);
    }

    .timeline-text {
      margin-top: 7px;
      font-size: 32px;
      line-height: 1.06;
      font-weight: 760;
    }

    .versus {
      margin-top: 55px;
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      align-items: center;
      gap: 18px;
    }

    .versus-card {
      min-height: 270px;
      padding: 32px;
      background: var(--surface);
      border: 2px solid var(--accent-primary);
    }

    .versus-card .name {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .versus-card .copy {
      margin-top: 30px;
      font-size: 34px;
      line-height: 1;
      font-weight: 900;
    }

    .vs {
      text-align: center;
      font-size: 38px;
      font-weight: 950;
      color: var(--accent-primary);
    }

    .mystery {
      margin-top: 70px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 25px;
      line-height: 1.25;
      color: var(--accent-primary);
      border-top: 1px solid var(--accent-primary);
      border-bottom: 1px solid var(--accent-primary);
      padding: 22px 0;
    }

    .minimal {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 100px;
    }

    .minimal .headline {
      max-width: 900px;
    }

    .payoff {
      margin-top: 44px;
      max-width: 820px;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 720;
    }

    .gold-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 12px;
      background: var(--accent-secondary);
    }

    .blackout {
      background: #111311 !important;
      color: #F4EFE4 !important;
    }

    .blackout .headline {
      color: #F4EFE4;
    }

    .blackout .accent-word,
    .blackout .signal {
      color: var(--accent-primary);
    }

    .blackout .footer,
    .blackout .top-meta {
      color: #F4EFE4;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .045;
      background-image:
        radial-gradient(#000 0.6px, transparent 0.7px);
      background-size: 5px 5px;
    }

    .blackout .grain {
      opacity: .07;
      background-image:
        radial-gradient(#fff 0.6px, transparent 0.7px);
    }
    
</style>
</head>

<body>
<section class="slide ">

  <div class="grain"></div>

  <div class="top-meta">
    <div>GETBYTERUSH / RECEIPTS</div>
    <div class="page-no">02 / 06</div>
  </div>

  <div class="rule"></div>

  <div class="kicker">THE PROBLEM</div>

  <h1 class="headline">
    The hidden bottleneck inside AI agents
  </h1>

  

  
            <div class="evidence-tag">REAL EVIDENCE</div>
            <div class="evidence-frame">
              <img src="file:///home/runner/work/getbyterush-automation-/getbyterush-automation-/output/posts/2026-08-28/1210-nvidia-ships-vera-its-first-custom-cpu-built-specifically-for-ai-agents/evidence/source.png" alt="Official source evidence">
            </div>
            

  <div class="footer">
    <div class="source">SOURCE / getByteRush Analysis</div>
    <div class="brand">TESTED • EXPLAINED • REAL</div>
  </div>

</section>
</body>
</html>
