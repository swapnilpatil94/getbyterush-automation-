name: GetByteRush Daily Carousel

# DAILY SELECTION (deterministic, zero Gemini calls) -> for each of the
# ~5 strongest candidates from the persistent pool, one at a time:
# EDITORIAL (1 Gemini call) -> GRAPHICS DIRECTOR V17 -> RENDER -> QA ->
# PUBLISHING PACKAGE -> TELEGRAM REVIEW. Runs once a day. Gemini calls
# equal the number of candidates actually selected that day (target is a
# floor/target of ~5, not a quota — fewer than 5 quality candidates means
# fewer posts, zero means NO_QUALITY_POST and nothing is sent to
# Telegram). This workflow NEVER publishes to Instagram — every post
# stops at AWAITING_TELEGRAM_APPROVAL. Publishing only happens from
# whichever workflow telegram_review_listener.py's PUBLISH_WORKFLOW
# points at (currently make-com-publish.yml), dispatched after an
# explicit human approval per post.

on:
  workflow_dispatch:
    inputs:
      daily_target:
        description: "Max posts to select+generate today (quality floor still applies)"
        required: false
        default: "5"
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  daily-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Cleanup old generated output
        run: python scripts/topic_memory.py cleanup

      - name: Daily selection + batch generation (1 Gemini call per selected post)
        env:
          PYTHONPATH: scripts
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SELECTION_TARGET: ${{ github.event.inputs.daily_target || '5' }}
        run: python scripts/run_daily_selection_batch.py

      - name: List generated output
        if: always()
        run: |
          echo "== daily content plan =="
          cat data/daily_content_plan.json 2>/dev/null || echo "(none)"
          echo "== output/posts =="
          find output/posts -type f -newer data/candidate_pool.json 2>/dev/null | sort || true
          echo "== state/pipeline =="
          find state/pipeline -type f | sort || true

      - name: Upload carousel + package as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-${{ github.run_number }}
          path: |
            output/posts/**
            data/pipeline/**
            state/pipeline/**
            data/daily_content_plan.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated production state
        if: always()
        run: |
          ./scripts/git_commit_push.sh "chore: generate GetByteRush daily carousels (V17)" output/posts/ data/selected_story.json data/selected_stories.json data/editorial_queue.json data/daily_content_plan.json data/candidate_pool.json data/pipeline/ state/topic_memory.json state/pipeline/

      - name: Upload debug data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-debug-${{ github.run_number }}
          path: |
            data/**
            output/**
            state/**
          if-no-files-found: warn
          retention-days: 3
