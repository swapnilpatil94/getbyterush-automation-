name: GetByteRush Daily Carousel

# Five daily SLOTS (IST), each generating at most ONE post for its own
# content-mix category, timed ~45 minutes before its public posting time
# so there's slack for the render -> QA -> Telegram chain to finish
# before the post is due. See scripts/content_slots.py for the
# schedule/category table.
#
#   morning     01:45 UTC (07:15 IST) -> public 08:00 IST -> EVERGREEN_VALUE
#   midmorning  05:15 UTC (10:45 IST) -> public 11:30 IST -> EXPERIMENT / PRODUCT_TOOL
#   afternoon   08:15 UTC (13:45 IST) -> public 14:30 IST -> LAST_24H
#   evening     12:15 UTC (17:45 IST) -> public 18:30 IST -> CURIOSITY / INTERNET_HUMAN_TECH_BEHAVIOR
#   night       14:45 UTC (20:15 IST) -> public 21:00 IST -> any (best remaining post of the day)
#
# NOTE: these 5 times are NOT scheduled here via GitHub's own `schedule:`
# trigger — confirmed live that it's unreliable for this project (on
# launch day, GitHub's scheduler fired 0 of the 5 crons; every run that
# day was manual). Cloudflare Cron Triggers own the schedule instead
# (cloudflare/telegram-webhook/wrangler.toml + src/index.js's
# scheduled() handler), firing this workflow via workflow_dispatch with
# the right `slot` input at each of the 5 times above — same fix already
# applied to Telegram approvals. This workflow only reacts to
# workflow_dispatch; it does not self-schedule.
#
# Each slot: DAILY SELECTION for that slot only (deterministic, zero
# Gemini calls) -> EDITORIAL (1 Gemini call) -> GRAPHICS DIRECTOR V17 ->
# RENDER -> QA -> PUBLISHING PACKAGE -> TELEGRAM REVIEW. A slot with
# nothing above the quality gate in its categories sends nothing to
# Telegram rather than forcing a weak pick (NO_QUALITY_POST for that
# slot only, not the whole day). This workflow NEVER publishes to
# Instagram — every post stops at AWAITING_TELEGRAM_APPROVAL. Publishing
# only happens from whichever workflow telegram_review_listener.py's
# PUBLISH_WORKFLOW points at (currently make-com-publish.yml), dispatched
# after an explicit human approval per post.
#
# The `slot` input is set by Cloudflare's cron -> workflow_dispatch call
# for the 5 scheduled times; leave it blank for manual full-batch mode
# (up to `daily_target` posts in one run) for testing/backfill.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Run a single named slot (morning/midmorning/afternoon/evening/night). Leave blank for full-batch mode."
        required: false
        default: ""
      daily_target:
        description: "Full-batch mode only (used when slot is blank): max posts to select+generate"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  daily-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Cleanup old generated output
        run: python scripts/topic_memory.py cleanup

      - name: Resolve which slot this run is (schedule cron -> slot name)
        id: slot
        env:
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, "scripts")
          import content_slots

          manual = os.environ.get("MANUAL_SLOT", "").strip()
          cron = os.environ.get("EVENT_SCHEDULE", "").strip()

          if manual:
              slot = manual if manual in content_slots.SLOTS else ""
          elif cron:
              slot = content_slots.slot_for_cron(cron) or ""
          else:
              slot = ""  # workflow_dispatch with no slot -> full-batch mode

          print(f"name={slot}")
          PY

      - name: Run one slot (1 Gemini call at most)
        if: steps.slot.outputs.name != ''
        env:
          PYTHONPATH: scripts
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_daily_selection_batch.py --slot "${{ steps.slot.outputs.name }}"

      - name: Run full batch (only when no slot resolved — manual/backfill)
        if: steps.slot.outputs.name == ''
        env:
          PYTHONPATH: scripts
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_SELECTION_TARGET: ${{ github.event.inputs.daily_target || '5' }}
        run: python scripts/run_daily_selection_batch.py

      - name: List generated output
        if: always()
        run: |
          echo "== daily content plan =="
          cat data/daily_content_plan.json 2>/dev/null || echo "(none)"
          echo "== output/posts =="
          find output/posts -type f -newer data/candidate_pool.json 2>/dev/null | sort || true
          echo "== state/pipeline =="
          find state/pipeline -type f | sort || true

      - name: Upload carousel + package as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-${{ github.run_number }}
          path: |
            output/posts/**
            data/pipeline/**
            state/pipeline/**
            data/daily_content_plan.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated production state
        if: always()
        run: |
          ./scripts/git_commit_push.sh "chore: generate GetByteRush carousel (slot=${{ steps.slot.outputs.name }})" output/posts/ data/selected_story.json data/selected_stories.json data/editorial_queue.json data/daily_content_plan.json data/candidate_pool.json data/pipeline/ state/topic_memory.json state/pipeline/

      - name: Upload debug data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-debug-${{ github.run_number }}
          path: |
            data/**
            output/**
            state/**
          if-no-files-found: warn
          retention-days: 3
