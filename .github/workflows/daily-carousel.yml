name: GetByteRush Daily Carousel

# EDITORIAL -> GRAPHICS DIRECTOR V17 -> RENDER -> QA -> PUBLISHING PACKAGE
# -> TELEGRAM REVIEW. Runs once a day: one Gemini call, one candidate
# carousel, one Telegram review card. This workflow NEVER publishes to
# Instagram — it stops at AWAITING_TELEGRAM_APPROVAL. Publishing only
# happens from publish-instagram.yml, dispatched by
# telegram_review_listener.py after an explicit human approval.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  daily-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Cleanup old generated output
        run: python scripts/topic_memory.py cleanup

      - name: Apply topic memory (blocks recently-used topics)
        run: python scripts/topic_memory.py prepare

      - name: Run Gemini Editorial Engine (1 call)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/editorial_engine.py

      - name: Record selected topic in memory
        run: python scripts/topic_memory.py record

      - name: Render V17 + QA + publishing package + send Telegram review
        env:
          PYTHONPATH: scripts
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_daily_carousel.py

      - name: List generated output
        if: always()
        run: |
          echo "== output/posts =="
          find output/posts -type f -newer data/selected_story.json 2>/dev/null | sort || true
          echo "== state/pipeline =="
          find state/pipeline -type f | sort || true

      - name: Upload carousel + package as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-${{ github.run_number }}
          path: |
            output/posts/**
            data/pipeline/**
            state/pipeline/**
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated production state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posts/ data/selected_story.json data/editorial_queue.json data/pipeline/ state/topic_memory.json state/pipeline/
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "chore: generate GetByteRush daily carousel (V17)"
            git push origin HEAD:main
          fi

      - name: Upload debug data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-daily-carousel-debug-${{ github.run_number }}
          path: |
            data/**
            output/**
            state/**
          if-no-files-found: warn
          retention-days: 3
