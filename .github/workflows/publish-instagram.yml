name: GetByteRush Publish to Instagram

# ABSOLUTE RULE: this workflow only runs when dispatched by
# telegram_review_listener.py after an explicit ✅ APPROVE & POST tap —
# there is no schedule trigger, no auto-publish-after-QA path, and no
# other caller. instagram_publish.py additionally refuses to publish
# anything whose content_state status isn't APPROVED, and is idempotent —
# calling it again for an already-PUBLISHED content_id does nothing.
#
# Requires FACEBOOK_PAGE_ACCESS_TOKEN (a Meta Business System User Page
# token — confirmed via a live discovery lookup to have access to both
# the Instagram Business Account and the Facebook Page) + INSTAGRAM_ACCOUNT_ID.
# FACEBOOK_PAGE_ID additionally enables the best-effort Facebook Page
# cross-post that runs after a successful Instagram publish — if it's
# missing, Instagram publishing still works, the cross-post is just
# skipped.

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "content_id to publish (must be APPROVED)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull latest state (avoid racing the approve-commit that dispatched this run)
        run: |
          for i in 1 2 3 4 5; do
            git pull --ff-only origin main && break
            echo "Pull attempt $i failed, retrying..."
            sleep 3
          done

      - name: Publish to Instagram + Facebook (idempotent — no-ops if already PUBLISHED)
        env:
          PYTHONPATH: scripts
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/instagram_publish.py "${{ inputs.content_id }}"

      - name: Commit publish state
        if: always()
        run: |
          ./scripts/git_commit_push.sh "chore: record Instagram publish result for ${{ inputs.content_id }}" state/pipeline/
