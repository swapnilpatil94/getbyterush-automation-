name: GetByteRush Refetch Evidence

# EVIDENCE rejection path. Dispatched by telegram_review_listener.py with
# content_id. Re-renders through V17 unchanged (same grammar selection —
# the problem was the captured screenshot, not the composition); the
# renderer's evidence step re-navigates and re-screenshots the source URL
# fresh on every run. Zero Gemini calls.

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: "content_id to refetch evidence for"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi
          python -m playwright install --with-deps chromium

      - name: Refetch evidence and re-render
        env:
          PYTHONPATH: scripts
        run: python scripts/refetch_evidence.py "${{ inputs.content_id }}"

      - name: Send updated Telegram review card
        env:
          PYTHONPATH: scripts
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_review.py "${{ inputs.content_id }}"

      - name: Commit re-rendered output + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posts/ state/pipeline/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refetch evidence for ${{ inputs.content_id }}"
            git push origin HEAD:main
          fi
