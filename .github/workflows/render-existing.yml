name: GetByteRush Render Existing Editorial

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Editorial package to render (auto = newest)"
        required: false
        default: "auto"
        type: string

permissions:
  contents: write

concurrency:
  group: getbyterush-render-existing
  cancel-in-progress: true

jobs:
  render-existing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reusable editorial package
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os
          from pathlib import Path

          requested = os.environ.get("REQUESTED_SOURCE", "auto").strip()
          selected = Path("data/selected_story.json")
          selected.parent.mkdir(parents=True, exist_ok=True)

          def load(path):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  if data.get("selected") and data.get("slides"):
                      return data
              except Exception:
                  pass
              return None

          if requested and requested != "auto":
              source = Path(requested)
              data = load(source)
              if not data:
                  raise SystemExit(f"Requested editorial package is missing or invalid: {source}")
              selected.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              print(f"RENDER_SOURCE={source}")
              print(f"RENDER_STORY={data.get('story_title', '(untitled)')}")
              print("GEMINI_CALL=0")
              raise SystemExit(0)

          if selected.exists():
              data = load(selected)
              if data:
                  print("RENDER_SOURCE=data/selected_story.json")
                  print(f"RENDER_STORY={data.get('story_title', '(untitled)')}")
                  print("GEMINI_CALL=0")
                  raise SystemExit(0)

          packages = []
          for path in Path("output/posts").glob("**/post.json"):
              data = load(path)
              if not data:
                  continue
              created = data.get("created_at", "")
              packages.append((created, path, data))

          if not packages:
              raise SystemExit("No reusable editorial package found in output/posts/**/post.json")

          packages.sort(key=lambda x: x[0], reverse=True)
          _, source, data = packages[0]
          selected.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"RENDER_SOURCE={source}")
          print(f"RENDER_STORY={data.get('story_title', '(untitled)')}")
          print("GEMINI_CALL=0")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Render saved editorial only
        env:
          PYTHONPATH: scripts
        run: |
          echo "Gemini is intentionally NOT called in this workflow."
          python scripts/carousel_production.py

      - name: Validate generated dimensions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path("output/posts")
          pngs = sorted(root.glob("**/slides/*.png"))
          if not pngs:
              raise SystemExit("No PNG slides were generated.")

          bad = []
          for p in pngs:
              try:
                  with Image.open(p) as im:
                      if im.size != (1080, 1350):
                          bad.append((str(p), im.size))
              except Exception as exc:
                  bad.append((str(p), str(exc)))

          if bad:
              raise SystemExit(f"Invalid slide dimensions/files: {bad[:10]}")

          print(f"✓ {len(pngs)} PNG slide(s) are exactly 1080x1350")
          PY

      - name: List generated output
        if: always()
        run: |
          echo "========================================"
          echo "RENDER-ONLY OUTPUT"
          echo "========================================"
          find output/posts -type f | sort || true

      - name: Upload Carousel Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-render-only-${{ github.run_number }}
          path: |
            output/**
            data/selected_story.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit rendered output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posts/ data/selected_story.json
          if git diff --cached --quiet; then
            echo "No rendered changes to commit."
          else
            git commit -m "chore: render saved GetByteRush editorial"
            git push origin HEAD:main
            echo "✓ Rendered package committed."
          fi
