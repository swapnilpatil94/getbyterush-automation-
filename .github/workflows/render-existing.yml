name: GetByteRush Render Existing Editorial

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Editorial package path (auto = selected/latest)"
        required: false
        default: "auto"
        type: string
      clean_old_outputs:
        description: "Delete generated packages older than 7 days before rendering"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 2,6,10,14,18,22 * * *"
  push:
    paths:
      - "scripts/carousel_art_renderer_v16.py"
      - "scripts/carousel_art_renderer_v9.py"
      - "assets/fonts/**"
      - ".github/workflows/render-existing.yml"

permissions:
  contents: write

concurrency:
  group: getbyterush-render-existing
  cancel-in-progress: true

jobs:
  render-existing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve reusable editorial package
        env:
          REQUESTED_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          requested=os.environ.get("REQUESTED_SOURCE","auto").strip()
          selected=Path("data/selected_story.json")
          selected.parent.mkdir(parents=True,exist_ok=True)
          def load(path):
              try: data=json.loads(path.read_text(encoding="utf-8"))
              except Exception: return None
              return data if data.get("selected") and isinstance(data.get("slides"),list) and data.get("slides") else None
          if requested and requested!="auto":
              source=Path(requested); data=load(source)
              if not data: raise SystemExit(f"Requested editorial package is missing or invalid: {source}")
          else:
              data=load(selected) if selected.exists() else None; source=selected if data else None
              if not data:
                  packages=[]
                  for path in Path("output/posts").glob("**/post.json"):
                      item=load(path)
                      if item: packages.append((item.get("created_at",""),path.stat().st_mtime,path,item))
                  if not packages: raise SystemExit("No reusable editorial package found")
                  packages.sort(key=lambda x:(x[0],x[1]),reverse=True); _,_,source,data=packages[0]
          selected.write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(f"RENDER_SOURCE={source}")
          print(f"RENDER_STORY={data.get('story_title','(untitled)')}")
          print(f"RENDER_SLIDES={len(data.get('slides',[]))}")
          print("GEMINI_CALL=0")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install pillow

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Compile V16 renderer
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile \
            scripts/carousel_art_renderer_v9.py \
            scripts/carousel_art_renderer_v16.py

      - name: Clean old outputs
        if: ${{ inputs.clean_old_outputs == true }}
        run: python scripts/topic_memory.py cleanup

      - name: Snapshot existing post packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gbr
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-before-posts.txt || true
          echo "Existing packages: $(wc -l < /tmp/gbr-before-posts.txt | tr -d ' ')"

      - name: Render saved editorial with V16 only
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          echo "Gemini is intentionally NOT called in this workflow."
          echo "Renderer: carousel_art_renderer_v16.py"
          python scripts/carousel_art_renderer_v16.py

      - name: Identify newly rendered package
        shell: bash
        run: |
          set -euo pipefail
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-after-posts.txt || true
          mapfile -t NEW_PACKAGES < <(comm -13 /tmp/gbr-before-posts.txt /tmp/gbr-after-posts.txt)
          COUNT=${#NEW_PACKAGES[@]}
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: expected exactly one new package, found $COUNT"
            printf '%s\n' "${NEW_PACKAGES[@]:-}"
            exit 1
          fi
          NEW_PACKAGE="${NEW_PACKAGES[0]}"
          echo "NEW_POST_PACKAGE=$NEW_PACKAGE" >> "$GITHUB_ENV"
          echo "NEW_POST_PACKAGE=$NEW_PACKAGE" >> "$GITHUB_OUTPUT"
          echo "✓ New package: $NEW_PACKAGE"
        id: identify_package

      - name: Validate selected render package
        shell: bash
        env:
          NEW_POST_PACKAGE: ${{ steps.identify_package.outputs.NEW_POST_PACKAGE }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          selected=json.loads(Path("data/selected_story.json").read_text(encoding="utf-8"))
          expected=len(selected.get("slides",[]))
          if not 5<=expected<=9: raise SystemExit(f"Unexpected editorial slide count: {expected}")
          package=Path(os.environ["NEW_POST_PACKAGE"])
          post_path=package / "post.json"
          if not post_path.exists(): raise SystemExit(f"Missing post.json: {package}")
          meta=json.loads(post_path.read_text(encoding="utf-8"))
          if meta.get("renderer") != "getbyterush-pinterest-editorial-v16":
              raise SystemExit(f"Wrong renderer in post.json: {meta.get('renderer')}")
          if meta.get("gemini_calls") != 0:
              raise SystemExit(f"Unexpected Gemini calls: {meta.get('gemini_calls')}")
          slides=sorted((package / "slides").glob("*.png"))
          if len(slides)!=expected: raise SystemExit(f"Expected {expected} slides, found {len(slides)}")
          for slide in slides:
              raw=slide.read_bytes()
              if len(raw)<24 or raw[:8]!=b"\x89PNG\r\n\x1a\n": raise SystemExit(f"Invalid PNG: {slide}")
              w=int.from_bytes(raw[16:20],"big"); h=int.from_bytes(raw[20:24],"big")
              if (w,h)!=(1080,1350): raise SystemExit(f"Invalid dimensions: {slide}={w}x{h}")
          html_dir=package / "html"
          leak=re.compile(r"callout graphic|visual concept|visual direction|design direction|layout instruction",re.I)
          for path in sorted(html_dir.glob("*.html")):
              text=path.read_text(encoding="utf-8")
              visible=re.sub(r"<[^>]+>"," ",text)
              if leak.search(visible): raise SystemExit(f"Internal/template text leaked: {path}")
          evidence=list((package / "evidence").glob("*.png"))
          for image in evidence:
              raw=image.read_bytes()
              if len(raw)<24 or raw[:8]!=b"\x89PNG\r\n\x1a\n": raise SystemExit(f"Invalid evidence PNG: {image}")
          print(f"✓ Selected package: {package}")
          print(f"✓ Slides: {len(slides)}")
          print("✓ Renderer: V16")
          print("✓ Dimensions: 1080x1350")
          print("✓ Internal design-text leak check passed")
          print("✓ Gemini calls: 0")
          PY

      - name: List generated output
        if: always()
        env:
          NEW_POST_PACKAGE: ${{ steps.identify_package.outputs.NEW_POST_PACKAGE }}
        run: find "${NEW_POST_PACKAGE:-output/posts}" -type f | sort || true

      - name: Upload Carousel Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-render-v16-${{ github.run_number }}
          path: |
            ${{ steps.identify_package.outputs.NEW_POST_PACKAGE }}/**
            data/selected_story.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit only the new rendered package
        if: success()
        env:
          NEW_POST_PACKAGE: ${{ steps.identify_package.outputs.NEW_POST_PACKAGE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -- output/posts/ || true
          git reset -- data/selected_story.json || true
          git add "$NEW_POST_PACKAGE"
          if git diff --cached --quiet; then
            echo "ERROR: new package produced no git changes"
            exit 1
          fi
          echo "Committing only: $NEW_POST_PACKAGE"
          git commit -m "chore: render GetByteRush Pinterest editorial v16"
          git push origin HEAD:main
