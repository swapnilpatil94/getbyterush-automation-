name: GetByteRush Render Existing Editorial

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: getbyterush-render-existing
  cancel-in-progress: false

jobs:
  render-existing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify saved editorial
        run: |
          test -s data/selected_story.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/selected_story.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not data.get("selected"):
              raise SystemExit("Saved editorial is not a selected story")
          print("✓ Reusing saved editorial:", data.get("story_title", "(untitled)"))
          print("✓ Gemini will NOT be called")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Render saved editorial
        run: python scripts/carousel_production.py

      - name: List generated output
        if: always()
        run: |
          echo "========================================"
          echo "RENDER-ONLY OUTPUT"
          echo "========================================"
          find output -type f | sort 2>/dev/null || true

      - name: Upload Carousel Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-render-${{ github.run_number }}
          path: |
            output/**
            data/selected_story.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit rendered output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posts/
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "chore: render GetByteRush carousel"
            git push origin HEAD:main
          fi
