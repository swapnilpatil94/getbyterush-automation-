name: GetByteRush Render Existing Editorial

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: getbyterush-render-existing
  cancel-in-progress: false

jobs:
  render-existing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find reusable editorial package
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          selected = Path("data/selected_story.json")
          if selected.exists() and selected.stat().st_size > 0:
              data = json.loads(selected.read_text(encoding="utf-8"))
              if data.get("selected"):
                  print("✓ Found data/selected_story.json")
                  print("✓ Gemini will NOT be called")
                  raise SystemExit(0)

          candidates = []
          for p in Path("output/posts").glob("**/post.json"):
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  if data.get("selected", True) and data.get("slides"):
                      created = data.get("created_at", "")
                      candidates.append((created, p, data))
              except Exception:
                  continue

          if not candidates:
              raise SystemExit("No reusable editorial package found in output/posts/**/post.json")

          candidates.sort(key=lambda item: item[0], reverse=True)
          _, package_path, data = candidates[0]
          selected.parent.mkdir(parents=True, exist_ok=True)
          selected.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          print("✓ Reusing latest saved editorial package:", package_path)
          print("✓ Story:", data.get("story_title", "(untitled)"))
          print("✓ Gemini will NOT be called")
          PY

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-editorial.txt ]; then pip install -r requirements-editorial.txt; fi

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Render saved editorial
        run: python scripts/carousel_production.py

      - name: List generated output
        if: always()
        run: |
          echo "========================================"
          echo "RENDER-ONLY OUTPUT"
          echo "========================================"
          if [ -d output ]; then find output/posts -type f | sort; fi

      - name: Upload Carousel Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-render-only-${{ github.run_number }}
          path: |
            output/**
            data/selected_story.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit rendered output
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/posts/ data/selected_story.json
          if git diff --cached --quiet; then
            echo "No rendered changes to commit."
          else
            git commit -m "chore: render saved GetByteRush editorial"
            git push origin HEAD:main
            echo "✓ Rendered package committed."
          fi
