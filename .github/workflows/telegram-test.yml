name: Telegram Test

on:
  workflow_dispatch:

jobs:
  send-telegram-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔥 GETBYTERUSH AUTOMATION TEST%0A%0A✅ GitHub Actions is connected to Telegram.%0A%0AThe GetByteRush publishing pipeline can now be built."