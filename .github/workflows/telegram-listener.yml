name: Telegram Listener

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Telegram approvals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/telegram_listener.py

      - name: Save Telegram offset
        run: |
          if git diff --quiet -- state/telegram_offset.txt; then
            echo "No Telegram offset changes."
            exit 0
          fi

          git config user.name "GetByteRush Bot"
          git config user.email "getbyterush-bot@users.noreply.github.com"

          git add state/telegram_offset.txt

          git commit -m "chore: update telegram update offset"

          git push