name: Telegram Listener (Manual Fallback)

# Polls for callback_query (button taps) and plain-text messages (optional
# rejection notes), drives the content_state machine, and dispatches
# regenerate-visual.yml / refetch-evidence.yml / whichever workflow PUBLISH_WORKFLOW points at —
# see scripts/telegram_review_listener.py. Shares the getbyterush-production
# concurrency group because a callback can commit to state/pipeline/ at
# the same time a render workflow is committing output/ — both must
# serialize through the same git push queue.
#
# The schedule trigger that used to run this every 5 minutes was removed:
# GitHub Actions does not honor high-frequency schedule triggers reliably
# (confirmed from this repo's own run history — actual gaps of 2-7 hours,
# never 5 minutes). telegram-webhook-dispatch.yml, triggered instantly by
# the Cloudflare Worker in cloudflare/telegram-webhook/, is now the
# primary delivery path. This workflow stays as a manual workflow_dispatch
# fallback for when the webhook path is down.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: getbyterush-production
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Telegram approvals / rejections / notes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: scripts
        run: |
          python3 scripts/telegram_review_listener.py

      - name: Save Telegram offset + pipeline state
        if: always()
        run: |
          ./scripts/git_commit_push.sh "chore: update telegram review state" state/telegram_offset.txt state/pipeline/