name: GetByteRush Pinterest Editorial Renderer V16

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,6,10,14,18,22 * * *"
  push:
    paths:
      - "scripts/carousel_art_renderer_v16.py"
      - "assets/fonts/**"
      - ".github/workflows/render-pinterest-v7.yml"

permissions:
  contents: write

concurrency:
  # Shared with render-existing.yml: both workflows commit and push to main,
  # so they must never run at the same time — a second run must queue behind
  # the first, not race its push or get cancelled mid-render.
  group: getbyterush-production-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Compile V16 renderer
        run: python -m py_compile scripts/carousel_art_renderer_v9.py scripts/carousel_art_renderer_v16.py
      - name: Snapshot packages
        run: |
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-before.txt || true
      - name: Render existing editorial — Gemini OFF
        run: |
          echo "GBR_RENDERER=V16"
          echo "GEMINI_CALL=0"
          python scripts/carousel_art_renderer_v16.py
      - name: Identify new package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-after.txt || true
          mapfile -t NEW < <(comm -13 /tmp/gbr-before.txt /tmp/gbr-after.txt)
          test "${#NEW[@]}" -eq 1
          echo "NEW_POST_PACKAGE=${NEW[0]}" >> "$GITHUB_OUTPUT"
      - name: Visual and structural QA
        env:
          NEW_POST_PACKAGE: ${{ steps.package.outputs.NEW_POST_PACKAGE }}
        run: |
          python - <<'PY'
          import os,re,json
          from pathlib import Path
          from PIL import Image
          p=Path(os.environ['NEW_POST_PACKAGE'])
          selected=json.loads(Path('data/selected_story.json').read_text())
          imgs=sorted((p/'slides').glob('*.png'))
          assert len(imgs)==len(selected['slides'])
          for f in imgs:
              im=Image.open(f)
              assert im.size==(1080,1350)
              im.verify()
          leak=re.compile(r'\b(?:visual[_ ]concept|visual[_ ]direction|callout graphic|design direction|layout instruction)\b',re.I)
          for f in (p/'html').glob('*.html'):
              visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',f.read_text(),flags=re.I|re.S)
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',visible,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible)
              assert not leak.search(visible),f
          post=json.loads((p/'post.json').read_text())
          assert post.get('gemini_calls')==0
          assert post.get('renderer')=='getbyterush-pinterest-editorial-v16',post.get('renderer')
          print(f'QA PASS: {len(imgs)} slides, 1080x1350, Gemini=0, renderer=v16')
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-pinterest-v16-${{ github.run_number }}
          path: ${{ steps.package.outputs.NEW_POST_PACKAGE }}/**
          if-no-files-found: error
          retention-days: 7
      - name: Commit only new package
        env:
          NEW_POST_PACKAGE: ${{ steps.package.outputs.NEW_POST_PACKAGE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -- output/posts/ data/selected_story.json || true
          # Defensive: a dirty tracked file (data/selected_story.json isn't
          # written by this workflow, but keep this symmetric with
          # render-existing.yml) would block `git rebase` if the push below
          # needs to retry.
          git checkout -- data/selected_story.json || true
          git add "$NEW_POST_PACKAGE"
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore: render GetByteRush Pinterest editorial v16"
          # Checkout is pinned to the commit that triggered this run, not the
          # live tip of main — even serialized behind render-existing.yml via
          # the shared concurrency group, that other job may have advanced
          # main while this one was rendering. Retry against the latest tip
          # rather than assume a plain push will fast-forward. The new
          # commit only adds a fresh, uniquely-named package directory, so
          # rebasing it onto a newer main is always conflict-free.
          attempt=1
          until git push origin HEAD:main; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Failed to push after $attempt attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto latest origin/main and retrying"
            git fetch origin main
            git rebase origin/main
            attempt=$((attempt + 1))
          done
