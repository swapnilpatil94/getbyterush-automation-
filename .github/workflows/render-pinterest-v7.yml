name: GetByteRush Pinterest Editorial Renderer V13

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2,6,10,14,18,22 * * *"
  push:
    paths:
      - "scripts/carousel_art_renderer_v13.py"
      - "scripts/carousel_art_renderer_v12.py"
      - "scripts/carousel_art_renderer_v11.py"
      - ".github/workflows/render-pinterest-v7.yml"

permissions:
  contents: write

concurrency:
  group: getbyterush-pinterest-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + QA dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Compile V13 renderer
        run: python -m py_compile scripts/carousel_art_renderer_v9.py scripts/carousel_art_renderer_v10.py scripts/carousel_art_renderer_v11.py scripts/carousel_art_renderer_v12.py scripts/carousel_art_renderer_v13.py
      - name: Snapshot packages
        run: |
          mkdir -p /tmp/gbr
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-before.txt || true
      - name: Render existing editorial — Gemini OFF
        run: |
          echo "GEMINI_CALL=0"
          python scripts/carousel_art_renderer_v13.py
      - name: Identify new package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          find output/posts -type f -name post.json -print 2>/dev/null | sed 's#/post.json$##' | sort > /tmp/gbr-after.txt || true
          mapfile -t NEW < <(comm -13 /tmp/gbr-before.txt /tmp/gbr-after.txt)
          test "${#NEW[@]}" -eq 1
          echo "NEW_POST_PACKAGE=${NEW[0]}" >> "$GITHUB_OUTPUT"
          echo "New package: ${NEW[0]}"
      - name: Visual and structural QA
        env:
          NEW_POST_PACKAGE: ${{ steps.package.outputs.NEW_POST_PACKAGE }}
        run: |
          python - <<'PY'
          import os,re,json
          from pathlib import Path
          from PIL import Image
          p=Path(os.environ['NEW_POST_PACKAGE'])
          selected=json.loads(Path('data/selected_story.json').read_text())
          expected=len(selected['slides'])
          imgs=sorted((p/'slides').glob('*.png'))
          assert len(imgs)==expected,(len(imgs),expected)
          for f in imgs:
              im=Image.open(f)
              assert im.size==(1080,1350), (f,im.size)
              im.verify()
          leak=re.compile(r'\b(?:visual[_ ]concept|visual[_ ]direction|callout graphic|design direction|layout instruction|INPUT|PROCESS|OUTCOME)\b',re.I)
          for f in (p/'html').glob('*.html'):
              text=re.sub(r'<[^>]+>',' ',f.read_text())
              assert not leak.search(text),f
          post=json.loads((p/'post.json').read_text())
          assert post.get('gemini_calls')==0
          assert post.get('renderer')=='getbyterush-pinterest-editorial-v13',post.get('renderer')
          print(f'QA PASS: {len(imgs)} slides, 1080x1350, Gemini=0, renderer=v13')
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-pinterest-v13-${{ github.run_number }}
          path: ${{ steps.package.outputs.NEW_POST_PACKAGE }}/**
          if-no-files-found: error
          retention-days: 7
      - name: Commit only new package
        env:
          NEW_POST_PACKAGE: ${{ steps.package.outputs.NEW_POST_PACKAGE }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset -- output/posts/ data/selected_story.json || true
          git add "$NEW_POST_PACKAGE"
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore: render GetByteRush Pinterest editorial v13"
          git push origin HEAD:main
