# TEMPORARY / MANUAL verification workflow.
#
# Purpose: let the repo owner independently verify, from real CI-rendered
# PNGs (not code inspection), that the V16 renderer produces a complete,
# QA-passing carousel for each of the 6 renderer-only test fixtures in
# scripts/fixtures/ — spanning consumer product, cybersecurity, social
# platforms, AI comparison, business impact, and human psychology content.
#
# This workflow is intentionally isolated from the production pipeline:
# - workflow_dispatch only — no schedule, no push trigger, never runs
#   unattended.
# - contents: read — it never needs to commit or push anything.
# - Fixture output is written to a /tmp path outside the repo, never to
#   data/ or output/posts/, and never committed. A dedicated step asserts
#   the working tree is unchanged as a hard check, not just an omission.
# - Does not touch the renderer or design system — pure verification.
#
# Safe to delete once the six-fixture output has been inspected and V16's
# frozen/needs-another-pass decision is made.
name: GetByteRush V16 Fixture Verification (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Compile V16 renderer
        run: python -m py_compile scripts/carousel_art_renderer_v9.py scripts/carousel_art_renderer_v16.py

      - name: Render all 6 fixtures — Gemini OFF, GBR_INPUT/GBR_OUT only, no production data touched
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          mkdir -p /tmp/fixture-verify
          for f in scripts/fixtures/*.json; do
            name=$(basename "$f" .json)
            echo "=== Rendering fixture: $name ==="
            GBR_INPUT="$f" GBR_OUT="/tmp/fixture-verify/$name" python scripts/carousel_art_renderer_v16.py
          done
          echo "GEMINI_CALLS=0 for all 6 fixtures (renderer never calls Gemini)"

      - name: QA — slide count, 1080x1350 PNGs, no internal-label leaks, correct renderer tag, per fixture
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          leak = re.compile(
              r'\b(?:visual[_ ]concept|visual[_ ]direction|callout graphic|design direction|layout instruction)\b',
              re.I,
          )
          root = Path('/tmp/fixture-verify')
          fixtures_dir = Path('scripts/fixtures')
          failures = []

          fixture_names = sorted(p.stem for p in fixtures_dir.glob('*.json'))
          if len(fixture_names) != 6:
              failures.append(f'expected 6 fixtures in scripts/fixtures/, found {len(fixture_names)}')

          for name in fixture_names:
              out_dir = root / name
              packages = list(out_dir.glob('*/*')) if out_dir.exists() else []
              if len(packages) != 1:
                  failures.append(f'{name}: expected exactly 1 rendered package, found {len(packages)}')
                  continue
              pkg = packages[0]
              expected = len(json.loads((fixtures_dir / f'{name}.json').read_text())['slides'])

              slides = sorted((pkg / 'slides').glob('*.png'))
              if len(slides) != expected:
                  failures.append(f'{name}: expected {expected} slides, found {len(slides)}')
              for f in slides:
                  raw = f.read_bytes()
                  if len(raw) < 24 or raw[:8] != b'\x89PNG\r\n\x1a\n':
                      failures.append(f'{f}: invalid PNG signature')
                      continue
                  w = int.from_bytes(raw[16:20], 'big')
                  h = int.from_bytes(raw[20:24], 'big')
                  if (w, h) != (1080, 1350):
                      failures.append(f'{f}: {w}x{h}, expected 1080x1350')

              for f in sorted((pkg / 'html').glob('*.html')):
                  text = f.read_text(encoding='utf-8')
                  visible = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.I | re.S)
                  visible = re.sub(r'<script\b[^>]*>.*?</script>', ' ', visible, flags=re.I | re.S)
                  visible = re.sub(r'<[^>]+>', ' ', visible)
                  m = leak.search(visible)
                  if m:
                      failures.append(f'{f}: internal-label leak {m.group(0)!r}')

              post = json.loads((pkg / 'post.json').read_text())
              if post.get('renderer') != 'getbyterush-pinterest-editorial-v16':
                  failures.append(f'{name}: wrong renderer tag {post.get("renderer")!r}')
              if post.get('gemini_calls') != 0:
                  failures.append(f'{name}: gemini_calls={post.get("gemini_calls")!r}, expected 0')

              print(f'{name}: {len(slides)}/{expected} slides -> {pkg}')

          if failures:
              print('\nFAILURES:')
              for f in failures:
                  print(' -', f)
              sys.exit(1)
          print('\nAll 6 fixtures pass QA: 1080x1350, no leaks, correct renderer tag, gemini_calls=0.')
          PY

      - name: Verify no production data or repo files were touched
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: working tree is dirty — something modified repo/production data."
            git status
            exit 1
          fi
          echo "Working tree clean: data/selected_story.json and output/posts/ untouched."

      - name: List generated output
        if: always()
        run: find /tmp/fixture-verify -type f | sort

      - name: Upload all 6 fixture carousels as one artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-v16-fixture-verification-${{ github.run_number }}
          path: /tmp/fixture-verify/**
          if-no-files-found: error
          retention-days: 14
