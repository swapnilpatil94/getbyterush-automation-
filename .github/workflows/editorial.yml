name: GetByteRush Editorial Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  editorial-production:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Install Python dependencies
      # ---------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-editorial.txt ]; then
            pip install -r requirements-editorial.txt
          fi

      # ---------------------------------------------------------
      # 4. Install Playwright
      # ---------------------------------------------------------

      - name: Install Playwright
        run: |
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------
      # 5. Run News Radar
      # ---------------------------------------------------------

      - name: Run News Radar
        run: |
          python scripts/radar.py

      # ---------------------------------------------------------
      # 6. Run Pre-filter
      # ---------------------------------------------------------

      - name: Run Pre-filter
        run: |
          python scripts/filter_stories.py

      # ---------------------------------------------------------
      # 7. Run Gemini Editorial Engine
      # ---------------------------------------------------------

      - name: Run Gemini Editorial Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/editorial_engine.py

      # ---------------------------------------------------------
      # 8. Generate Carousel
      # ---------------------------------------------------------

      - name: Generate Carousel
        run: |
          python scripts/carousel_generator.py

      # ---------------------------------------------------------
      # 9. Show generated files
      # ---------------------------------------------------------

      - name: List generated output
        if: always()
        run: |
          echo "========================================"
          echo "GETBYTERUSH GENERATED OUTPUT"
          echo "========================================"

          if [ -d "output" ]; then
            find output -type f | sort
          else
            echo "No output directory found."
          fi

      # ---------------------------------------------------------
      # 10. Upload carousel package
      # ---------------------------------------------------------

      - name: Upload Carousel Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-carousel-${{ github.run_number }}
          path: |
            output/**
            data/selected_story.json
            data/editorial_queue.json
          if-no-files-found: warn
          retention-days: 7


      # ---------------------------------------------------------
      # 11. Commit generated carousel to repository
      # ---------------------------------------------------------

      - name: Commit generated carousel
        if: success()
        run: |
          echo "========================================"
          echo "COMMITTING GETBYTERUSH GENERATED OUTPUT"
          echo "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/posts/

          if git diff --cached --quiet; then
            echo "No new carousel files to commit."
          else
            git commit -m "chore: generate GetByteRush carousel"
            git push
            echo "✓ Generated carousel committed and pushed."
          fi

      # ---------------------------------------------------------
      # 11. Upload debug files if something fails
      # ---------------------------------------------------------

      - name: Upload debug data
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: getbyterush-debug-${{ github.run_number }}
          path: |
            data/**
            output/**
          if-no-files-found: warn
          retention-days: 3