name: Repair Renderer Theme Policy

on:
  push:
    paths:
      - .github/workflows/repair-renderer-theme.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch renderer theme policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/carousel_generator.py")
          source = path.read_text(encoding="utf-8")

          new_infer_template = '''def infer_template(story):
              design = story.get("design") if isinstance(story.get("design"), dict) else {}
              explicit = clean(first(story.get("template"), design.get("template"))).lower()
              category = clean(first(
                  story.get("content_type"),
                  story.get("story_type"),
                  story.get("category"),
                  story.get("type"),
              ))

              # Generic "story" is not a strong enough design decision for
              # technical stories. Prefer the explainer system so hardware,
              # infrastructure and model stories communicate mechanism/clarity.
              if explicit in THEME_BY_TEMPLATE and explicit != "story":
                  return explicit

              technical_categories = {"TECH_NEWS", "MODEL_UPDATE", "AI_AGENTS"}
              if category in technical_categories:
                  return "breakdown"

              for slide in story.get("slides", []):
                  visual = clean(first(slide.get("visual_type"), slide.get("layout"))).lower()
                  if visual in {"metric", "number", "stat"}:
                      return "shock-number"
                  if visual in {"comparison", "versus"}:
                      return "comparison"
                  if visual in {"timeline", "history"}:
                      return "timeline"
                  if visual in {"evidence", "screenshot", "receipt"}:
                      return "receipts"

              return TEMPLATE_BY_CATEGORY.get(category, "story")

          '''

          source, count = re.subn(
              r"def infer_template\(story\):\n.*?\n\ndef infer_theme\(story, template\):",
              new_infer_template + "def infer_theme(story, template):",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not locate infer_template block")

          new_infer_theme = '''def infer_theme(story, template):
              design = story.get("design") if isinstance(story.get("design"), dict) else {}
              raw = clean(first(story.get("emotional_mode"), design.get("emotional_mode"))).lower()
              category = clean(first(
                  story.get("content_type"),
                  story.get("story_type"),
                  story.get("category"),
                  story.get("type"),
              ))

              # Technical stories use the clarity palette unless the editorial
              # payload explicitly identifies a genuine investigation/fact-check.
              investigation = raw in {"investigation", "receipts", "fact_check", "fact-check"}
              technical = category in {"TECH_NEWS", "MODEL_UPDATE", "AI_AGENTS"}
              if technical and not investigation:
                  name = "explainer"
              else:
                  name = ALIASES.get(raw, raw) if raw else THEME_BY_TEMPLATE.get(template, "brand")

              if story.get("emergency_mode") is True:
                  name = "urgency"
              if name not in THEMES:
                  name = THEME_BY_TEMPLATE.get(template, "brand")
              return name, THEMES[name]

          '''

          source, count = re.subn(
              r"def infer_theme\(story, template\):\n.*?\n\ndef slide_role\(slide, index, total\):",
              new_infer_theme + "def slide_role(slide, index, total):",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Could not locate infer_theme block")

          path.write_text(source, encoding="utf-8")

          # Syntax gate before commit.
          compile(source, str(path), "exec")
          print("Renderer theme policy patched and syntax-checked")
          PY

      - name: Commit renderer fix and remove one-off repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/carousel_generator.py
          git rm .github/workflows/repair-renderer-theme.yml
          git commit -m "fix: map technical stories to explainer color psychology"
          git push
