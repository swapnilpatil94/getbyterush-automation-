name = "getbyterush-telegram-webhook"
main = "src/index.js"
compatibility_date = "2026-08-31"

# No KV, no D1, no Durable Objects, no bindings — this Worker holds no
# state at all and needs none: it forwards one HTTP request to another
# HTTP request. Free plan is more than sufficient (100k requests/day).

[vars]
# Not secret — a public repo path, not a credential. Secrets
# (TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, GITHUB_DISPATCH_TOKEN) are
# set with `wrangler secret put`, never written here or in source.
GITHUB_REPOSITORY = "swapnilpatil94/getbyterush-automation-"

[triggers]
# The 5 GetByteRush content-slot times (UTC) — must match
# scripts/content_slots.py's SLOTS[*].cron_utc. GitHub Actions'
# schedule: trigger proved unreliable for these (confirmed: fired 0/5
# times on launch day), so Cloudflare's Cron Triggers own the schedule
# instead and fire daily-carousel.yml directly via workflow_dispatch
# (see scheduled() in src/index.js). Free plan covers cron triggers.
crons = [
  "45 1 * * *",   # morning    -> 07:15 IST, public 08:00 IST, EVERGREEN_VALUE
  "15 5 * * *",   # midmorning -> 10:45 IST, public 11:30 IST, EXPERIMENT/PRODUCT_TOOL
  "15 8 * * *",   # afternoon  -> 13:45 IST, public 14:30 IST, LAST_24H
  "15 12 * * *",  # evening    -> 17:45 IST, public 18:30 IST, CURIOSITY/INTERNET_HUMAN
  "45 14 * * *",  # night      -> 20:15 IST, public 21:00 IST, any (best of day)
]
